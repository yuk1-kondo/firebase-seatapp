<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桜和会2025 歓送迎会 リアルタイム座席一覧表</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="./firebase-config.js"></script>
  <style>
    :root {
      --base-width: 1200;
      --scale: 1;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: sans-serif;
      background: #e8edf2;
      color: #37474f;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 1em;
    }
    h1 {
      margin-top: 0.5em;
      font-size: 1.8em;
      flex-shrink: 0;
      color: #ff750f;
      border-bottom: 3px solid #ff750f;
      padding-bottom: 0.3em;
      display: inline-block;
    }
    #scale-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex: 1;
      overflow: hidden;
    }
    #layout-wrapper {
      transform-origin: top center;
      transition: transform 0.2s ease;
    }
    #layout {
      width: 1200px;
      margin: 0 auto;
      padding: 1em;
    }
    .table-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5em;
      margin-bottom: 1.5em;
      justify-items: center;
    }
    .table-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f6f8fa;
      border: 1px solid #d7e0e8;
      border-radius: 15px;
      padding: 12px 15px;
      box-shadow: 0 2px 6px rgba(55, 71, 79, 0.08);
      width: 260px;
      min-height: 120px;
    }
    .table-label {
      font-weight: bold;
      margin-bottom: 0.5em;
      color: #ff750f;
      font-size: 1em;
    }
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
    }
    .seat {
      width: 100%;
      aspect-ratio: 1.4;
      padding: 3px;
      border-radius: 6px;
      background-color: transparent;
      border: 2px dashed #c7d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.75em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #6f7b85;
    }
    .seat.occupied {
      background-color: #546e7a;
      border: none;
      color: white;
      font-weight: bold;
    }
    .seat.empty {
      background-color: transparent;
      border: 2px dashed #c7d1d9;
      color: #6f7b85;
    }
    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f6f8fa;
      border: 1px solid #d7e0e8;
      border-radius: 15px;
      padding: 12px 15px;
      box-shadow: 0 2px 6px rgba(55, 71, 79, 0.08);
      width: 260px;
      min-height: 120px;
    }
    .qr-block p {
      font-size: 0.85em;
      margin: 0 0 0.5em 0;
      color: #555;
    }
    .qr-block img {
      max-width: 80px;
      height: auto;
    }
    #resetBtn {
      display: none;
      margin-top: 1.5em;
      padding: 10px 20px;
      font-size: 1em;
      background: #ef5350;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>桜和会2025 忘年会 座席一覧表</h1>
  <div id="scale-container">
    <div id="layout-wrapper">
      <div id="layout"></div>
    </div>
  </div>

  <button id="resetBtn" onclick="resetAssignments()">🔄 割り当てをリセット</button>

  <script>
    const layout = document.getElementById("layout");
    const resetBtn = document.getElementById("resetBtn");
    const layoutWrapper = document.getElementById("layout-wrapper");
    const scaleContainer = document.getElementById("scale-container");
    
    // テーブルごとの席数（Firebaseから取得するか、ここで定義）
    // 最大10席まで対応
    const tableSeatCounts = {
      A: 6, B: 5, C: 5, D: 5,
      E: 4, F: 4, G: 2, H: 2,
      I: 2, J: 2, K: 10, L: 6
    };

    // テーブル名のリスト（順番通り）
    const tableNames = Object.keys(tableSeatCounts);

    let currentAssignments = {};

    // 画面サイズに合わせてスケールを調整
    function adjustScale() {
      const containerWidth = scaleContainer.offsetWidth;
      const containerHeight = window.innerHeight - 100;
      const layoutWidth = 1200;
      const layoutHeight = layoutWrapper.scrollHeight || 600;
      
      const scaleX = (containerWidth - 40) / layoutWidth;
      const scaleY = (containerHeight - 40) / layoutHeight;
      const scale = Math.min(scaleX, scaleY, 1.5);
      
      layoutWrapper.style.transform = `scale(${Math.max(scale, 0.4)})`;
    }

    function createTableBlock(tableName) {
      const tableBlock = document.createElement("div");
      tableBlock.className = "table-block";

      const label = document.createElement("div");
      label.className = "table-label";
      label.textContent = `テーブル${tableName}`;
      tableBlock.appendChild(label);

      const seatsGrid = document.createElement("div");
      seatsGrid.className = "seats-grid";

      const count = tableSeatCounts[tableName];
      for (let i = 1; i <= count; i++) {
        const seatCode = `${tableName}${i}`;
        const seatDiv = document.createElement("div");
        seatDiv.className = "seat";
        const name = Object.entries(currentAssignments).find(([_, s]) => s === seatCode)?.[0];
        seatDiv.textContent = name || "空席";
        if (name) {
          seatDiv.classList.add("occupied");
        } else {
          seatDiv.classList.add("empty");
        }
        seatsGrid.appendChild(seatDiv);
      }

      tableBlock.appendChild(seatsGrid);
      return tableBlock;
    }

    function createQRBlock() {
      const qrBlock = document.createElement("div");
      qrBlock.className = "qr-block";
      qrBlock.innerHTML = `
        <p>スマホで確認</p>
        <img src="/qr_seatapp.png" alt="座席一覧QRコード" />
      `;
      return qrBlock;
    }

    function renderLayout() {
      layout.innerHTML = "";
      
      // テーブルを4つずつの行に分割
      const tablesPerRow = 4;
      let tableIndex = 0;

      while (tableIndex < tableNames.length) {
        const row = document.createElement("div");
        row.className = "table-row";

        // 1行に最大4テーブル配置
        for (let i = 0; i < tablesPerRow && tableIndex < tableNames.length; i++) {
          const tableName = tableNames[tableIndex];
          row.appendChild(createTableBlock(tableName));
          tableIndex++;
        }

        // 最後の行の場合、残りのスロットにQRコードを配置
        if (tableIndex >= tableNames.length) {
          const remainingSlots = tablesPerRow - row.children.length;
          // 残りがあればQRを追加（最後の位置に）
          if (remainingSlots > 0 || row.children.length === tablesPerRow) {
            // 最後のテーブルの後にQRを追加（次の行として）
          }
        }

        layout.appendChild(row);
      }

      // QRコードを最終行に追加（独立した行として、または最後の行に追加）
      const lastRow = layout.lastElementChild;
      if (lastRow && lastRow.children.length < tablesPerRow) {
        // 最後の行に空きがあればQRを追加
        lastRow.appendChild(createQRBlock());
      } else {
        // 空きがなければ新しい行を作成
        const qrRow = document.createElement("div");
        qrRow.className = "table-row";
        qrRow.appendChild(createQRBlock());
        layout.appendChild(qrRow);
      }

      adjustScale();
    }

    firebase.database().ref("assignments").on("value", snapshot => {
      currentAssignments = snapshot.val() || {};
      renderLayout();
    });

    // Firebaseからテーブル設定を取得（オプション）
    firebase.database().ref("tableConfig").on("value", snapshot => {
      const config = snapshot.val();
      if (config) {
        // テーブル設定が存在する場合は更新
        Object.keys(config).forEach(table => {
          if (config[table] && config[table].seats) {
            tableSeatCounts[table] = Math.min(config[table].seats, 10); // 最大10席
          }
        });
        // tableNamesを更新
        tableNames.length = 0;
        tableNames.push(...Object.keys(tableSeatCounts));
        renderLayout();
      }
    });

    // ウィンドウリサイズ時にスケール調整
    window.addEventListener("resize", adjustScale);
    window.addEventListener("load", adjustScale);

    function resetAssignments() {
      if (confirm("全ての席割り当てをリセットしてもよろしいですか？")) {
        firebase.database().ref("assignments").remove();
      }
    }

    // URL に ?admin=true があればリセットボタンを表示
    if (window.location.search.includes("admin=true")) {
      resetBtn.style.display = "inline-block";
    }
  </script>
</body>
</html>
