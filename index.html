<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桜和会2025 忘年会 リアルタイム座席一覧表</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./utils.js"></script>
  <link rel="stylesheet" href="./common.css">
  <style>
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-overlay.hidden {
      display: none;
    }

    /* QR Code Section hidden by default in HTML, shown via JS in grid */
    #qr-template {
      display: none;
    }
  </style>
</head>

<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading"></div>
  </div>

  <div class="container container--with-footer">
    <div class="page-header">
      <h1 id="listPageHeading">桜和会2025 忘年会 座席一覧表</h1>
    </div>

    <div id="layoutSummary" class="layout-summary" aria-live="polite"></div>
    <div id="layout" class="tables-container"></div>

    <!-- Template for QR Code to be cloned into grid -->
    <div id="qr-template">
      <div id="qr-section">
        <p style="font-size: 1.5vh; margin: 0.5vh 0;">スマホで確認</p>
        <img id="qr-code" src="./qr_seatapp.png" alt="座席一覧QRコード">
      </div>
    </div>

    <footer class="site-footer">© 2025 桜和会座席ルーレット- Developed by YUKI KONDO</footer>
  </div>

  <script>
    class SeatDisplayApp {
      constructor() {
        this.utils = window.seatAppUtils;
        this.layout = document.getElementById("layout");
        this.loadingOverlay = document.getElementById("loadingOverlay");
        this.tableSeatCounts = {};
        this.currentAssignments = {};
        this.init();
      }

      async init() {
        try {
          this.showLoading(true);

          // 設定とデータを並行読み込み
          await this.loadInitialData();

          // リアルタイムリスナーを設定
          this.setupRealtimeListeners();

        } catch (error) {
          console.error('初期化エラー:', error);
          this.showError('アプリケーションの初期化に失敗しました');
        } finally {
          this.showLoading(false);
        }
      }

      async loadInitialData() {
        const settings = await this.utils.getSettings();
        this.tableSeatCounts = settings.tables;
        const t = this.utils.getResolvedEventStrings(settings.event);
        const headingEl = document.getElementById('listPageHeading');
        if (headingEl) headingEl.textContent = t.listHeading;
        document.title = t.indexDocTitle;
        this.utils.log('設定読み込み完了', settings);
      }

      setupRealtimeListeners() {
        this.utils.addListener('assignments', (assignments) => {
          this.currentAssignments = assignments || {};
          this.renderAllTables();
        }, 'seatDisplay');
      }

      renderAllTables() {
        if (!this.layout) return;

        this.layout.innerHTML = "";
        const visibleTables = this.getVisibleTables();
        const tableKeys = visibleTables.map(({ block }) => block);
        this.applyLayoutDensity(visibleTables);
        this.renderLayoutSummary(visibleTables);

        if (tableKeys.length === 0) {
          this.renderNoTablesMessage();
          return;
        }

        // テーブルを配置
        tableKeys.forEach(block => {
          const tableBlock = this.renderTableBlock(block);
          if (tableBlock) {
            this.layout.appendChild(tableBlock);
          }
        });

        // QRコードをグリッドの最後に配置
        this.appendQRCode();
      }

      getVisibleTables() {
        return Object.keys(this.tableSeatCounts).sort().reduce((tables, block) => {
          const config = this.tableSeatCounts[block];
          if (!config) return tables;

          const count = typeof config === 'object' ? config.seats : config;
          const enabled = typeof config === 'object' ? config.enabled !== false : true;

          if (enabled && count && count > 0) {
            tables.push({ block, count });
          }

          return tables;
        }, []);
      }

      applyLayoutDensity(visibleTables) {
        if (!this.layout) return;

        const tableCount = visibleTables.length;
        const maxSeats = visibleTables.reduce((max, table) => Math.max(max, table.count), 0);
        const totalSeats = visibleTables.reduce((sum, table) => sum + table.count, 0);
        const density = tableCount <= 3 ? 'sparse' : tableCount <= 8 ? 'balanced' : 'dense';

        this.layout.classList.remove('layout-density-sparse', 'layout-density-balanced', 'layout-density-dense');
        this.layout.classList.add(`layout-density-${density}`);
        this.layout.dataset.tableCount = String(tableCount);
        this.layout.dataset.maxSeats = String(maxSeats);
        this.layout.dataset.totalSeats = String(totalSeats);

        const layoutByDensity = {
          sparse: {
            minWidth: 'clamp(260px, 32vw, 420px)',
            maxWidth: '420px',
            gap: 'clamp(14px, 1.6vw, 28px)',
            seatSize: maxSeats >= 8 ? 'clamp(48px, 6.4vh, 74px)' : 'clamp(60px, 8vh, 88px)'
          },
          balanced: {
            minWidth: maxSeats >= 8 ? 'clamp(220px, 24vw, 320px)' : 'clamp(210px, 23vw, 300px)',
            maxWidth: '1fr',
            gap: 'clamp(10px, 1.1vw, 20px)',
            seatSize: maxSeats >= 8 ? 'clamp(48px, 6.2vh, 74px)' : 'clamp(54px, 7.2vh, 84px)'
          },
          dense: {
            minWidth: maxSeats >= 8 ? 'clamp(170px, 18vw, 250px)' : 'clamp(180px, 19vw, 260px)',
            maxWidth: '1fr',
            gap: 'clamp(8px, 0.8vw, 16px)',
            seatSize: totalSeats >= 80 ? 'clamp(42px, 5.6vh, 64px)' : 'clamp(46px, 6vh, 70px)'
          }
        };

        const selected = layoutByDensity[density];
        this.layout.style.setProperty('--table-min-width', selected.minWidth);
        this.layout.style.setProperty('--table-max-width', selected.maxWidth);
        this.layout.style.setProperty('--table-grid-gap', selected.gap);
        this.layout.style.setProperty('--seat-size', selected.seatSize);
      }

      renderLayoutSummary(visibleTables) {
        const summary = document.getElementById('layoutSummary');
        if (!summary) return;

        const totalSeats = visibleTables.reduce((sum, table) => sum + table.count, 0);
        const assignedSeats = Object.values(this.currentAssignments || {})
          .filter(seat => typeof seat === 'string' && seat).length;
        const emptySeats = Math.max(totalSeats - assignedSeats, 0);

        if (visibleTables.length === 0) {
          summary.hidden = true;
          summary.innerHTML = '';
          return;
        }

        summary.hidden = false;
        summary.innerHTML = `
          <div class="summary-item summary-item--tables">
            <span class="summary-label">テーブル</span>
            <span class="summary-value">${visibleTables.length}卓</span>
          </div>
          <div class="summary-item summary-item--assigned">
            <span class="summary-label">着席済み</span>
            <span class="summary-value">${assignedSeats}名</span>
          </div>
          <div class="summary-item summary-item--empty">
            <span class="summary-label">空席</span>
            <span class="summary-value">${emptySeats}席</span>
          </div>
        `;
      }

      renderTableBlock(block) {
        const config = this.tableSeatCounts[block];
        if (!config) return null;

        // オブジェクト形式: {seats: number, enabled: boolean} または従来の数値形式に対応
        let count, enabled;
        if (typeof config === 'object') {
          count = config.seats;
          enabled = config.enabled !== false;
        } else {
          count = config;
          enabled = true;
        }

        // 無効なテーブルまたは座席数0は表示しない
        if (!enabled || !count || count <= 0) return null;

        const tableBlock = this.utils.createElement("div", "table-block");

        const occupiedCount = Array.from({ length: count }, (_, index) => `${block}${index + 1}`)
          .filter(seatCode => this.findSeatOccupant(seatCode)).length;

        // テーブルラベル
        const label = this.utils.createElement("div", "table-label");
        label.innerHTML = `<span>テーブル${block}</span><span class="table-count">${occupiedCount}/${count}</span>`;
        tableBlock.appendChild(label);

        // 座席行
        const seatsRow = this.utils.createElement("div", "seats-row");

        for (let i = 1; i <= count; i++) {
          const seatCode = `${block}${i}`;
          const seatDiv = this.createSeatElement(seatCode);
          seatsRow.appendChild(seatDiv);
        }

        tableBlock.appendChild(seatsRow);
        return tableBlock;
      }

      createSeatElement(seatCode) {
        const seatDiv = this.utils.createElement("div", "seat");
        const occupant = this.findSeatOccupant(seatCode);

        seatDiv.textContent = occupant || "空席";
        seatDiv.setAttribute('data-seat', seatCode);
        seatDiv.setAttribute('aria-label', `座席${seatCode}: ${occupant || '空席'}`);

        if (!occupant) {
          seatDiv.classList.add("empty");
        }

        seatDiv.setAttribute('role', 'text');

        return seatDiv;
      }

      findSeatOccupant(seatCode) {
        return Object.entries(this.currentAssignments).find(([_, seat]) => seat === seatCode)?.[0];
      }

      appendQRCode() {
        const template = document.getElementById("qr-template");
        if (template) {
          const qrContent = template.firstElementChild.cloneNode(true);
          this.layout.appendChild(qrContent);
        }
      }

      renderNoTablesMessage() {
        const message = this.utils.createElement("div", "");
        message.innerHTML = `
          <p style="text-align: center; color: var(--text-muted); font-size: 1.2rem; margin: 3rem 0;">
            📋 テーブル設定がありません<br>
            <small>座席表の準備が完了するまでお待ちください</small>
          </p>
        `;
        this.layout.appendChild(message);
      }

      showLoading(isLoading) {
        if (this.loadingOverlay) {
          this.loadingOverlay.classList.toggle('hidden', !isLoading);
        }
      }

      showError(message) {
        // 簡単なエラー表示（本来はtoastなどが望ましい）
        alert(`エラー: ${message}`);
      }

      destroy() {
        this.utils.removeListeners('seatDisplay');
      }
    }

    // アプリ初期化
    document.addEventListener('DOMContentLoaded', () => {
      window.seatDisplayApp = new SeatDisplayApp();
    });

    // ページ離脱時のクリーンアップ
    window.addEventListener('beforeunload', () => {
      window.seatDisplayApp?.destroy();
    });
  </script>
</body>

</html>
