<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ルーレット操作</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./utils.js"></script>
  <link rel="stylesheet" href="./common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    #result.roulette-animation {
      animation: rouletteSpin 0.1s infinite;
    }

    @keyframes rouletteSpin {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .no-members-message {
      text-align: center;
      color: var(--text-muted);
      font-size: clamp(0.95rem, calc(0.3rem + 1.5vmin), 1.2rem);
      margin: clamp(1.5rem, 6vmin, 3rem) 0;
      padding: clamp(1rem, 3vmin, 2rem);
      background: var(--surface-subtle);
      border-radius: var(--border-radius);
    }
  </style>
</head>

<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading"></div>
  </div>

  <div class="container container--with-footer">
    <div id="control-layout">
      <div class="page-header">
        <h1 id="roulettePageHeading">桜和会2025 忘年会座席ルーレット</h1>
        <div class="admin-links" id="adminLinks">
          <a href="admin.html">⚙️ 設定</a>
          <a href="index.html">📋 座席表示</a>
        </div>
      </div>

      <div class="control-status" aria-live="polite">
        <div class="control-stat">
          <span class="control-stat-label">選択中</span>
          <span class="control-stat-value" id="selectedStatus">未選択</span>
        </div>
        <div class="control-stat">
          <span class="control-stat-label">決定済み</span>
          <span class="control-stat-value" id="assignedStatus">0名</span>
        </div>
        <div class="control-stat">
          <span class="control-stat-label">残り</span>
          <span class="control-stat-value" id="remainingStatus">0名</span>
        </div>
      </div>

      <div id="nameButtons" class="grid grid-4"></div>

      <div id="control-footer">
        <div id="result"></div>
        <div id="control-buttons">
          <button id="lotteryBtn" class="btn btn-primary btn-large" onclick="startLottery()">🎰 ルーレット開始</button>
          <button id="adminResetBtn" class="btn btn-danger" onclick="resetAssignments()">🔄 リセット</button>
        </div>
      </div>
    </div>

    <footer class="site-footer">© 2025 桜和会座席ルーレット- Developed by YUKI KONDO</footer>
  </div>

  <script>
    class RouletteApp {
      constructor() {
        this.utils = window.seatAppUtils;
        this.loadingOverlay = document.getElementById("loadingOverlay");
        this.nameButtons = document.getElementById("nameButtons");
        this.lotteryBtn = document.getElementById("lotteryBtn");
        this.resultDiv = document.getElementById("result");
        this.selectedStatus = document.getElementById("selectedStatus");
        this.assignedStatus = document.getElementById("assignedStatus");
        this.remainingStatus = document.getElementById("remainingStatus");

        // アプリ状態
        this.knownMembers = [];
        this.allSeats = [];
        this.tableSeatCounts = {};
        this.fixedAssignments = {};
        this.selectedName = null;
        this.rouletteTimer = null;
        this.availableSeats = [];
        this.animationSeats = [];
        this.isSpinning = false;
        this.currentAssignments = {};

        this.init();
      }

      async init() {
        try {
          this.showLoading(true);

          // 管理者モードの確認
          if (this.utils.isAdminMode()) {
            document.getElementById("adminResetBtn").classList.add("is-visible");
            document.getElementById("adminLinks").classList.add("show");
          }

          // 設定データを読み込み
          await this.loadSettings();

          // リアルタイムリスナーを設定
          this.setupRealtimeListeners();

        } catch (error) {
          console.error('初期化エラー:', error);
          this.showError('アプリケーションの初期化に失敗しました');
        } finally {
          this.showLoading(false);
        }
      }

      async loadSettings() {
        const settings = await this.utils.getSettings();

        this.knownMembers = settings.members;
        this.tableSeatCounts = settings.tables;
        this.fixedAssignments = settings.fixed;

        // 座席リストを生成
        this.generateAllSeats();

        // 初回ボタン描画
        this.renderButtons();

        const t = this.utils.getResolvedEventStrings(settings.event);
        const headingEl = document.getElementById('roulettePageHeading');
        if (headingEl) headingEl.textContent = t.rouletteHeading;
        document.title = t.rouletteDocTitle;

        this.utils.log('設定読み込み完了', {
          membersCount: this.knownMembers.length,
          tablesCount: Object.keys(this.tableSeatCounts).length,
          fixedCount: Object.keys(this.fixedAssignments).length
        });
      }

      generateAllSeats() {
        this.allSeats = this.utils.generateSeats(this.tableSeatCounts);
      }

      setupRealtimeListeners() {
        this.utils.addListener('assignments', (assignments) => {
          this.currentAssignments = assignments || {};
          this.renderButtons();
          this.updateStatusSummary();
        }, 'roulette');
      }

      renderButtons() {
        if (!this.nameButtons) return;

        this.nameButtons.innerHTML = "";

        if (this.knownMembers.length === 0) {
          this.renderNoMembersMessage();
          return;
        }

        this.knownMembers.forEach(name => {
          const btn = this.utils.createElement("button", "", name);
          btn.disabled = Object.keys(this.currentAssignments).includes(name);
          btn.onclick = () => this.selectMember(name, btn);

          // アクセシビリティ
          btn.setAttribute('aria-pressed', 'false');
          btn.setAttribute('data-member', name);

          this.nameButtons.appendChild(btn);
        });

        this.updateStatusSummary();
      }

      renderNoMembersMessage() {
        const message = this.utils.createElement("div", "no-members-message");
        message.innerHTML = `
          👥 参加者が登録されていません<br>
          <small>管理者画面で参加者を登録してください</small>
        `;
        this.nameButtons.appendChild(message);
        this.lotteryBtn.disabled = true;
      }

      selectMember(name, btn) {
        this.selectedName = name;

        // 全ボタンの選択状態をリセット
        this.nameButtons.querySelectorAll("button").forEach(b => {
          b.classList.remove("selected");
          b.setAttribute('aria-pressed', 'false');
        });

        // 選択されたボタンをハイライト
        btn.classList.add("selected");
        btn.setAttribute('aria-pressed', 'true');

        this.showResult(`${name}先生を選択中...`, true);
        this.lotteryBtn.disabled = false;
        this.updateStatusSummary();

        this.utils.log('参加者選択', name);
      }

      async startLottery() {
        if (!this.selectedName || this.isSpinning) return;

        try {
          this.isSpinning = true;
          this.updateLotteryButton(true);

          // 現在の割り当て状況を取得
          const assignedSeats = Object.values(this.currentAssignments);

          // 既に割り当て済みかチェック
          if (this.currentAssignments[this.selectedName]) {
            this.showError(`${this.selectedName}先生はすでに席が割り当てられています`);
            this.resetBtn();
            return;
          }

          // 利用可能座席を計算
          this.availableSeats = this.utils.getAvailableSeats(
            this.allSeats,
            this.currentAssignments,
            this.selectedName,
            this.fixedAssignments
          );

          if (this.availableSeats.length === 0) {
            this.showError("空き席がありません");
            this.resetBtn();
            return;
          }

          this.animationSeats = this.utils.getVisualRouletteSeats(
            this.allSeats,
            this.currentAssignments
          );

          // ルーレットアニメーション開始
          this.startRouletteAnimation();

        } catch (error) {
          console.error('ルーレット開始エラー:', error);
          this.showError('ルーレットの開始でエラーが発生しました');
          this.resetBtn();
        }
      }

      startRouletteAnimation() {
        this.resultDiv.classList.add('roulette-animation');

        const pool = this.animationSeats.length > 0
          ? this.animationSeats
          : this.availableSeats;

        this.rouletteTimer = setInterval(() => {
          const showSeat = pool[Math.floor(Math.random() * pool.length)];
          this.showResult(`${this.selectedName}先生 → テーブル${showSeat.charAt(0)}`, true);
        }, 100);
      }

      async stopLottery() {
        if (!this.isSpinning) return;

        try {
          clearInterval(this.rouletteTimer);
          this.resultDiv.classList.remove('roulette-animation');

          // 最終座席を決定
          const finalSeat = this.fixedAssignments[this.selectedName] ||
            this.availableSeats[Math.floor(Math.random() * this.availableSeats.length)];

          if (!finalSeat) {
            this.showError('座席の割り当てに失敗しました');
            this.resetBtn();
            return;
          }

          // Firebaseに保存
          const success = await this.utils.setData(`assignments/${this.selectedName}`, finalSeat);

          if (success) {
            this.showResult(`🎉 ${this.selectedName}先生の席は テーブル${finalSeat} に決定！`, true);
            this.utils.log('座席決定', { member: this.selectedName, seat: finalSeat });
          } else {
            this.showError('座席の保存に失敗しました');
          }

        } catch (error) {
          console.error('座席割り当てエラー:', error);
          this.showError('座席の割り当てでエラーが発生しました');
        } finally {
          this.resetBtn();
          this.selectedName = null;
          this.updateStatusSummary();
        }
      }

      updateLotteryButton(isSpinning) {
        if (!this.lotteryBtn) return;

        if (isSpinning) {
          this.lotteryBtn.textContent = "⏹️ ストップ";
          this.lotteryBtn.onclick = () => this.stopLottery();
          this.lotteryBtn.classList.remove('btn-primary');
          this.lotteryBtn.classList.add('btn-danger');
        } else {
          this.lotteryBtn.textContent = "🎰 ルーレット開始";
          this.lotteryBtn.onclick = () => this.startLottery();
          this.lotteryBtn.classList.remove('btn-danger');
          this.lotteryBtn.classList.add('btn-primary');
          this.lotteryBtn.disabled = !this.selectedName;
        }
      }

      resetBtn() {
        this.isSpinning = false;
        this.updateLotteryButton(false);
      }

      showResult(text, show = false) {
        if (!this.resultDiv) return;

        this.resultDiv.textContent = text;
        this.resultDiv.classList.toggle('show', show);
      }

      async resetAssignments() {
        const confirmed = await this.utils.confirm("全ての席割り当てをリセットしますか？");
        if (!confirmed) return;

        try {
          this.showLoading(true);
          const success = await this.utils.removeData("assignments");

          if (success) {
            this.showResult("", false);
            this.selectedName = null;
            this.updateStatusSummary();
            this.utils.log('割り当てリセット完了');
          } else {
            this.showError('リセットに失敗しました');
          }
        } catch (error) {
          console.error('リセットエラー:', error);
          this.showError('リセット処理でエラーが発生しました');
        } finally {
          this.showLoading(false);
        }
      }

      showLoading(isLoading) {
        if (this.loadingOverlay) {
          this.loadingOverlay.classList.toggle('hidden', !isLoading);
        }
      }

      showError(message) {
        alert(`エラー: ${message}`);
      }

      updateStatusSummary() {
        const assignedCount = Object.keys(this.currentAssignments || {}).length;
        const totalCount = this.knownMembers.length;
        const remainingCount = Math.max(totalCount - assignedCount, 0);

        if (this.selectedStatus) {
          this.selectedStatus.textContent = this.selectedName ? `${this.selectedName}先生` : '未選択';
        }
        if (this.assignedStatus) {
          this.assignedStatus.textContent = `${assignedCount}名`;
        }
        if (this.remainingStatus) {
          this.remainingStatus.textContent = `${remainingCount}名`;
        }
      }

      destroy() {
        if (this.rouletteTimer) {
          clearInterval(this.rouletteTimer);
        }
        this.utils.removeListeners('roulette');
      }
    }

    // グローバル関数（既存のHTMLから呼び出されるため）
    function startLottery() {
      if (window.rouletteApp) {
        window.rouletteApp.startLottery();
      }
    }

    function resetAssignments() {
      if (window.rouletteApp) {
        window.rouletteApp.resetAssignments();
      }
    }

    // アプリ初期化
    document.addEventListener('DOMContentLoaded', () => {
      window.rouletteApp = new RouletteApp();
    });

    // ページ離脱時のクリーンアップ
    window.addEventListener('beforeunload', () => {
      window.rouletteApp?.destroy();
    });
  </script>
</body>

</html>
